name: Reusable Docker Buildscript
on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      label:
        required: false
        default: "latest"
        type: string
      path:
        required: false
        default: "./"
        type: string
      owner:
        required: true
        type: string
      push:
        required: false
        default: true
        type: boolean
      registry:
        required: false
        default: "ghcr.io"
        type: string
      platforms:
        required: false
        default: "linux/amd64,linux/arm64"
        type: string
      rotate:
        required: false
        default: true
        type: boolean
concurrency:
  group: docker-${{ inputs.owner }}-${{ inputs.name }}
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log into GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.registry }}/${{ inputs.owner }}/${{ inputs.name }}
          tags: |
            type=raw,value=${{ inputs.label }}
            type=raw,value=latest
      - name: Build and push multi-platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.path }}
          file: ${{ inputs.path }}/Dockerfile
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ inputs.platforms }}
      - name: Delete old images
        if: ${{ inputs.push && inputs.rotate }}
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          keep-n-untagged: 1
          keep-n-tagged: 2
          exclude-tags: latest
          package: ${{ inputs.name }}
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
